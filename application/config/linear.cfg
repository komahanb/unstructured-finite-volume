# A design of zero, which makes the physics the harmonic oscillator.
# Every derivative of the functional in the design is then a
# statement about a linear problem, and the functional itself can be
# checked against the cosine by hand.

physics                  = vanderpol
state_degree             = 2
design                   = 0.0

time_duration            = 2.0
instants                 = 21
grid                     = uniform

max_derivative_degree    = 2
max_discretization_order = 3

families                 = bdf adams
combinations             = homogeneous
