# The van der pol field over an ellipse: two spatial coordinates
# under one temporal one. The mesh is structured in (xi, eta) on the
# unit square and mapped to the domain by its geometry, so the same
# counts serve a rectangle, a disc or an ellipse, and its spacing is
# given as the time grid's is.
#
# check = ode compares the field at kappa = 0 against one node's
# equation; check = mode compares a rectangle at nu = 0 against the
# exact mode. export = paraview writes every instant.

physics                  = vanderpol
state_degree             = 2
design                   = 1.0
initial_state            = 1.0

time_duration            = 3.0
instants                 = 11
grid                     = uniform
seed                     = 20260826
startup_refinement       = 4

spatial_geometry         = elliptical
spatial_extent           = 2.0 1.0
spatial_counts           = 4 8
spatial_grid             = uniform
diffusion                = 0.1
initial_field            = bump

max_derivative_degree    = 2
max_discretization_order = 2

families                 = bdf adams
combinations             = homogeneous

export                   = none
export_path              = field
check                    = routes
