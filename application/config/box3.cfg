# The separated mode on the box in three coordinates at nu = 0, the
# spatial law substituted as the fitted balance, against the exact
# mode and the exact laplacian of the mode. At 12 x 6 x 6 cells the
# operator's relative rms error is 9.3e-2 and the bdf2 error at the
# last instant 7.1e-3; with the derivatives as rows of the jet the
# bdf2 error reads 4.7e-2 at 8 x 4 x 4 and 9.9e-3 at 16 x 8 x 8. At
# 16 x 8 x 8 the balance's boundary fits at form degree 2 are ill
# conditioned: the operator error on the cells with one boundary
# face reads 8.6e+1.
physics                  = vanderpol
state_degree             = 2
design                   = 0.0
initial_state            = 1.0

time_duration            = 0.5
instants                 = 11
grid                     = uniform
startup_refinement       = 2

spatial_geometry         = cartesian
spatial_extent           = 2.0 1.0 1.0
spatial_counts           = 12 6 6
spatial_grid             = uniform
spatial_order            = 2
diffusion                = 0.1
initial_field            = mode

max_derivative_degree    = 1
max_discretization_order = 2

families                 = bdf
combinations             = 1

rows                     = states state-time-derivatives
export                   = none
check                    = mode operator
