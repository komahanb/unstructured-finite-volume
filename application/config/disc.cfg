# The disc of radius a: the polar mesh, whose angular coordinate is
# identified across the seam, whose outer ring meets the curved Neumann
# boundary dq/dr = 0, and whose centre is one polygonal cell of its own.
# The operator is compared against kappa times the laplacian of the
# quartic (r^2 - a^2)^2, whose radial derivative vanishes at r = a, and
# the balance summed over every cell is checked against zero. Over
# 9 x 16, 17 x 32 and 33 x 64 cells at form degree 2 the interior
# relative rms error reads 3.7e-2, 1.2e-2, 3.7e-3 and the centre cell
# 3.5e-2, 1.0e-2, 2.7e-3.

physics                  = vanderpol
state_degree             = 2
design                   = 0.0
initial_state            = 1.0

time_duration            = 0.5
instants                 = 3
grid                     = uniform
startup_refinement       = 2

spatial_geometry         = circular
spatial_extent           = 1.0 1.0
spatial_counts           = 17 32
spatial_grid             = uniform
spatial_order            = 2
diffusion                = 0.1
initial_field            = constant

max_derivative_degree    = 0
max_discretization_order = 1

families                 = bdf
combinations             = 1

rows                     = states state-time-derivatives
export                   = none
check                    = operator
