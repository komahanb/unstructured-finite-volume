design                   = 1.0

time_duration            = 7.0
instants                 = 24
grid                     = random
seed                     = 20260824

max_derivative_degree    = 2
max_discretization_order = 3

families                 = bdf adams dirk
combinations             = homogeneous pairs triples
mixed_orders             = .false.
