# The van der pol field over an ellipse, resolved for viewing. It
# states the same problem as field.cfg and differs only in what it
# spends: the mesh is finer, and every setting below it is the one
# that buys mesh with the time saved.
#
# Cost is the square of the cell count, measured: at eleven instants
# over both orders, 365 cells 4.2 s, 761 cells 18.9 s, 1513 cells
# 76.8 s, the exponent between consecutive pairs 2.05 and 2.02. The
# count of linear solves does not move with the mesh - it is 33 at
# every size - so the growth is the cost of one solve, not more of
# them. Under a square law a saving of k in time buys sqrt(k) in
# cells, which is what the four settings below are for.
#
# sweep = time solves one instant at a time, so a block is nodes by
# degrees rather than that times the instants: 2.2 times. jacobian =
# matrix holds the block by its non-zeros rather than applying it
# unassembled: 1.7 times, and 484 MB down to 28 MB. storage = sparse
# is then forced - dense asks for a square of the block size and
# refuses the mesh - and linear_solver = direct is not built over
# sparse storage, so iterative is the only solver here.
# max_derivative_degree = 0 asks for the state alone: the sensitivity
# columns cost more than the march and no picture shows them.
#
# tolerance = 1.0e-6 is set by what the picture can resolve, not by
# taste. Against the same run at 1.0e-12 the state departs by 3.3e-6
# of its own spread over the cells - a millionth of the colour range,
# below the width of a contour - while the run is 2.5 times shorter.
# krylov_restart = 30 costs 1.3 times less than 60 at this block size.
# Together they take 1513 cells from 189 s to 71 s.

physics                  = vanderpol
state_degree             = 2
design                   = 1.0
initial_state            = 1.0

time_duration            = 3.0
instants                 = 11
grid                     = uniform
seed                     = 20260826
startup_refinement       = 4

spatial_geometry         = elliptical
spatial_extent           = 2.0 1.0
spatial_counts           = 28 56
spatial_grid             = uniform
diffusion                = 0.1
initial_field            = bump

max_derivative_degree    = 0
max_discretization_order = 2

families                 = bdf
combinations             = homogeneous

space                    = coupled
time                     = sequential
jacobian                 = matrix
rows                     = states state-time-derivatives
elimination              = symbolic
storage                  = sparse
linear_solver            = iterative
tolerance                = 1.0e-6
tolerance_criterion      = relative
krylov_restart           = 30

# export = paraview writes one .vtu per instant per scheme, named
# <export_path>_<scheme>_<instant>.vtu. export_path is a prefix, not a
# directory, and no directory is created; the path below writes into
# the working directory. Open the _bdf2_ series in paraview - the file
# dialog groups the numbered instants into one time series - and
# colour by q0, the state; q1 is its first derivative in time.
# max_discretization_order runs the orders from one, so bdf1 is
# written beside bdf2; set it to 1 for bdf1 alone at half the time.

export                   = paraview
export_path              = vdp
check                    = none
