# The Taylor-Green vortex on the periodic box of side 2 pi at
# nu = 0.01: u = (sin x cos y, -cos x sin y) e^(-2 nu t) and
# p = (cos 2x + cos 2y) e^(-4 nu t) / 4, the exact solution of the
# incompressible Navier-Stokes equations. The velocity components and
# the pressure are state fields, the spatial derivatives components of
# their jets tied by the fit's rows, the pressure rule the divergence
# of momentum, and the pressure fixed at one node. nu is the design,
# so the dissipation's derivatives in nu are read with the flow. At
# 8 x 8, 16 x 16 and 32 x 32 cells, bdf2, the velocity error at the
# last instant reads 2.2e-1, 5.7e-2, 1.4e-2, the pressure error with
# its mean removed 3.3e-1, 6.4e-2, 1.3e-2, the divergence 1.7e-1,
# 6.6e-2, 1.8e-2: second order. The linear solves are GMRES
# preconditioned by block Gauss-Seidel over the tuples: 24 s at 16 x 16
# against 350 s without the preconditioner, 170 s at 32 x 32. The
# tying rows of the jet are eliminated before each linear solve, the
# Schur complement over the three state components per cell, and the
# Newton step is Halley's: 16 s at 16 x 16 and 104 s at 32 x 32 with
# rows = states against 24 and 176 with every row, the same digits.

physics                  = taylor_green
state_degree             = 1
design                   = 0.01
initial_field            = exact

time_duration            = 1.0
instants                 = 11
grid                     = uniform
startup_refinement       = 2

spatial_geometry         = periodic
spatial_extent           = 6.283185307179586 6.283185307179586
spatial_counts           = 16 16
spatial_grid             = uniform
spatial_order            = 2

max_derivative_degree    = 1
max_discretization_order = 2

families                 = bdf
combinations             = 1
functionals              = energy dissipation

rows                     = states
elimination              = numerical
higher_order_jacobian_product = 2
linear_solver            = iterative
storage                  = sparse
preconditioner           = gauss_seidel
export                   = paraview
export_path              = taylor_green
check                    = exact
