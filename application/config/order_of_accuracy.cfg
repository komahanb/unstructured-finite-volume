# How the order-of-accuracy demonstration refines its grids.
#
# The coarsest grid carries coarsest_instants per window. Each grid
# after it carries refinement_ratio times the last, rounded to whole
# instants, and all of them are measured against a reference
# reference_refinement beyond the finest.
#
# THE RATIO NEED NOT BE TWO. Doubling makes every coarse instant fall
# on a fine one, and it samples the step sizes sparsely, so a grid may
# land near a step at which a leading error coefficient changes sign.
# Reading the same order at a second ratio - 1.618, say, or 1.5 - is
# what shows a reading is the scheme's order and not an accident of
# where the grids fell. Try:
#
#   --demo=order_of_accuracy --refinement_ratio=1.618 --refinement_grids=5
#
# Cost grows as the reference grid, which is the finest times
# reference_refinement, so raising refinement_grids is the expensive
# knob and lowering refinement_ratio is the cheap one.

physics                  = vanderpol
state_degree             = 2
design                   = 1.0

time_duration            = 2.0
max_derivative_degree    = 6

refinement_ratio         = 2.0
refinement_grids         = 4
coarsest_instants        = 10
reference_refinement     = 2.5

# How far a reading may fall below p and still be read as reaching it,
# and how far the pairwise readings may disagree and still be read as
# one power of h. Raise spread_tolerance to see a doubtful fit's number
# anyway; lower it to be told about every wobble.
order_tolerance          = 0.5
spread_tolerance         = 1.0
