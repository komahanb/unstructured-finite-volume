# What each derivative order costs against the others.
#
# One family at one order, because every row the table builds adds to
# the same tally: naming two orders would average the matrix over two
# schemes rather than describe one.
#
# The horizon is kept well under the count past which the march stops
# converging and spends its whole iteration budget instead. A ratio
# measured past that reports the budget and not the derivative order,
# and the run says so beneath the tables when it happens.

physics                  = vanderpol
state_degree             = 2
design                   = 1.0

time_duration            = 3.0
instants                 = 41
grid                     = uniform
startup_refinement       = 4

max_derivative_degree    = 4
max_discretization_order = 1

families                 = bdf
combinations             = 1

# How a march stops. A relative tolerance divides the imbalance by the
# one the march began at, which is the question asked whenever the
# target is a reduction. An absolute one compares the imbalance itself,
# which is the question asked only where that number means something on
# its own - a functional driven under a stated value.
#
# by_rate takes the budget from the rate the march shows: it stops
# where the slope of the imbalance's logarithm over the last few
# iterations is no longer distinguishable from zero against its own
# scatter, and where a slope significantly below zero has been seen
# before. max_iterations is then a backstop and not the operative
# limit.

tolerance                = 1.0e-12
tolerance_criterion      = relative
iteration_criterion      = by_rate
max_iterations           = 100

accounting               = .true.
measurements             = wall_time primal_loops tangent_loops adjoint_loops newton_solves linear_solves factorisations
