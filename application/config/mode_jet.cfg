# The separated mode cos(pi x / a) cos(pi y / b) cos(omega t) on the
# rectangle at nu = 0, the spatial derivatives as components of the
# jet, each tied to the values by the fit's row at form degree 2, and
# the law reading them, against the exact mode. Over 10 x 5, 20 x 10 and
# 40 x 20 cells the bdf2 error at the last instant reads 2.3e-2, 4.9e-3,
# 1.2e-3: second order, with the one-sided fits at the boundary.

physics                  = vanderpol
state_degree             = 2
design                   = 0.0
initial_state            = 1.0

time_duration            = 0.5
instants                 = 11
grid                     = uniform
startup_refinement       = 2

spatial_geometry         = cartesian
spatial_extent           = 2.0 1.0
spatial_counts           = 20 10
spatial_grid             = uniform
spatial_order            = 2
diffusion                = 0.1
initial_field            = mode

max_derivative_degree    = 1
max_discretization_order = 2

families                 = bdf
combinations             = 1

rows                     = states state-time-derivatives state-spatial-derivatives
export                   = none
check                    = mode
