# The whole wave on the periodic box in three coordinates at nu = 0,
# solved iteratively over sparse storage. Over 8 x 4 x 4 and 16 x 8 x 8
# cells the operator's relative rms error reads 5.2e-1 and 1.6e-1 and
# the bdf2 error at the last instant 1.5e-1 and 4.5e-2; with the jet
# rows 5.5e-2 at 16 x 8 x 8, and at 8 x 4 x 4 the fit's reach around
# the period is refused.
physics                  = vanderpol
state_degree             = 2
design                   = 0.0
initial_state            = 1.0

time_duration            = 0.5
instants                 = 11
grid                     = uniform
startup_refinement       = 2

spatial_geometry         = periodic
spatial_extent           = 2.0 1.0 1.0
spatial_counts           = 16 8 8
spatial_grid             = uniform
spatial_order            = 2
diffusion                = 0.1
initial_field            = mode

max_derivative_degree    = 1
max_discretization_order = 2

families                 = bdf
combinations             = 1

rows                     = states state-time-derivatives
export                   = none
check                    = mode operator
linear_solver            = iterative
storage                  = sparse
