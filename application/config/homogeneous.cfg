# Every primitive scheme on its own, over one horizon.
#
# The steps are drawn from the seed and scaled to sum to the
# duration, so the grid is not uniform and no row is given an
# easier one than another.

physics                  = vanderpol
state_degree             = 2
design                   = 1.0

time_duration            = 7.0
instants                 = 21
grid                     = random
seed                     = 20260824
startup_refinement       = 4

max_derivative_degree    = 3
max_discretization_order = 4

families                 = bdf adams dirk
combinations             = homogeneous

automatic_order_conservation = .true.
