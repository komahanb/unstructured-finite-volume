# The Taylor-Green vortex on the periodic box in three coordinates,
# u_3 = 0 and no dependence on z, so the planar exact solution holds
# and the same check applies. At 8 x 8 x 8 cells, bdf2: velocity error
# 2.3e-1 at the last instant against 2.2e-1 on the plane at the same
# spacing, pressure error with its mean removed 5.7e-1, divergence
# 1.9e-1; the kinetic energy integral 60.07 against the exact
# 2 pi x 9.675 = 60.79. 160 s with GMRES preconditioned by the block
# sweeps. Every instant is written for paraview as taylor_green_3d_*.


physics                  = taylor_green
state_degree             = 1
design                   = 0.01
initial_field            = exact

time_duration            = 1.0
instants                 = 11
grid                     = uniform
startup_refinement       = 2

spatial_geometry         = periodic
spatial_extent           = 6.283185307179586 6.283185307179586 6.283185307179586
spatial_counts           = 8 8 8
spatial_grid             = uniform
spatial_order            = 2

max_derivative_degree    = 1
max_discretization_order = 2

families                 = bdf
combinations             = 1
functionals              = energy dissipation

rows                     = states state-time-derivatives state-spatial-derivatives
linear_solver            = iterative
storage                  = sparse
preconditioner           = gauss_seidel
export                   = paraview
export_path              = taylor_green_3d
check                    = exact
