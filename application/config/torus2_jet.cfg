# torus2.cfg with the spatial derivatives as rows of the jet: over
# 20 x 10, 40 x 20 and 80 x 40 cells the bdf2 error at the last
# instant reads 2.9e-2, 9.2e-3, 4.0e-3.
physics                  = vanderpol
state_degree             = 2
design                   = 0.0
initial_state            = 1.0

time_duration            = 0.5
instants                 = 11
grid                     = uniform
startup_refinement       = 2

spatial_geometry         = periodic
spatial_extent           = 2.0 1.0
spatial_counts           = 20 10
spatial_grid             = uniform
spatial_order            = 2
diffusion                = 0.1
initial_field            = mode

max_derivative_degree    = 1
max_discretization_order = 2

families                 = bdf
combinations             = 1

rows                     = states state-time-derivatives state-spatial-derivatives
export                   = none
check                    = mode
