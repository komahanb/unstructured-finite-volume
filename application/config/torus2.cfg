# The whole wave cos(2 pi x / a) cos(2 pi y / b) cos(omega t) on the
# periodic box at nu = 0: the opposite sides identified across the
# period, no boundary. Over 20 x 10, 40 x 20 and 80 x 40 cells the
# operator's relative rms error reads 8.4e-2, 2.2e-2, 5.5e-3 and the
# bdf2 error at the last instant 2.2e-2, 7.4e-3, 3.6e-3, the last
# at the bdf2 time error of 2.3e-3 at this step.
physics                  = vanderpol
state_degree             = 2
design                   = 0.0
initial_state            = 1.0

time_duration            = 0.5
instants                 = 11
grid                     = uniform
startup_refinement       = 2

spatial_geometry         = periodic
spatial_extent           = 2.0 1.0
spatial_counts           = 20 10
spatial_grid             = uniform
spatial_order            = 2
diffusion                = 0.1
initial_field            = mode

max_derivative_degree    = 1
max_discretization_order = 2

families                 = bdf
combinations             = 1

rows                     = states state-time-derivatives
export                   = none
check                    = mode operator
