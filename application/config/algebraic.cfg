# The van der pol equation with q**2 as a second state field y, tied
# by the algebraic rule y - q**2 = 0: two fields, two rules, the
# second read at degree zero along the instants. The same run as
# uniform.cfg, so each printed number is compared against that run's.
# A staged family evaluates the differential rule at the stages
# alone and the algebraic rule at the arriving instant as well.

physics                  = vanderpol_algebraic
state_degree             = 2
design                   = 1.0

time_duration            = 7.0
instants                 = 21
grid                     = uniform
startup_refinement       = 4

max_derivative_degree    = 3
max_discretization_order = 4

families                 = bdf adams dirk
combinations             = 1
