# What each derivative order costs against the others.
#
# One family at one order, because every row the table builds adds to
# the same tally: naming two orders would average the matrix over two
# schemes rather than describe one.
#
# The horizon is kept well under the count past which the march stops
# converging and spends its whole iteration budget instead. A ratio
# measured past that reports the budget and not the derivative order,
# and the run says so beneath the tables when it happens.

physics                  = vanderpol
state_degree             = 2
design                   = 1.0

time_duration            = 3.0
instants                 = 41
grid                     = uniform
startup_refinement       = 4

max_derivative_degree    = 4
max_discretization_order = 1

families                 = bdf
combinations             = homogeneous

accounting               = .true.
measurements             = wall_time primal_loops tangent_loops adjoint_loops newton_solves linear_solves factorisations
